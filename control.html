<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#402a1d">
  <title>Control · Cartel COT</title>
  <link rel="icon" href="COT.ico">
  <link rel="manifest" href="control.webmanifest">
  <link rel="apple-touch-icon" href="img/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cartel COT">
  <script src="datos.js"></script>
  <style>
    @font-face { font-family: "bigdots"; src: url(fonts/bigdots/BigDots.ttf); }
    @font-face { font-family: "triad"; src: url(fonts/triad/Triad_xs.ttf); }
    :root {
      --marron: #402a1d;
      --marron-2: #5a3e2c;
      --naranja: #884a00;
      --cot: #f0511a;
      --fondo: #ffffff;
      --fila: #eeeeee;
      --texto: #402a1d;
      --gris: #7a6c63;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    header {
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 6px solid;
      border-image: linear-gradient(yellow, red) 1;
    }
    header img { height: 28px; }
    header h1 { font: 400 22px/1 "bigdots", monospace; flex: 1; white-space: nowrap; }
    .estado-tele { display: flex; align-items: center; gap: 6px; font: 400 15px/1 "triad", monospace; white-space: nowrap; }
    .punto { width: 10px; height: 10px; background: #999; }
    .punto.ok { background: #00ff33; box-shadow: 0 0 6px #00ff33; }
    .punto.viejo { background: #ff2020; box-shadow: 0 0 6px #ff2020; }

    main { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); }
    section { padding: 0 16px 18px; background: #fff; }
    /* Secciones intercaladas: blanco / gris, para separarlas bien */
    main > section:nth-of-type(even) { background: #e9e6e3; --fila: #ffffff; }
    main > section:nth-of-type(even) .lista button:nth-child(even),
    main > section:nth-of-type(even) .tarifa-fila:nth-child(even) { background: #f6f4f2; }
    h2 {
      margin: 0 -16px 12px;
      padding: 8px 16px;
      background: var(--marron);
      color: #fff;
      font: 400 18px/1 "bigdots", monospace;
      letter-spacing: 0.04em;
    }

    .sonando { font: 400 24px/1.15 "triad", monospace; }
    .sonando-sub { color: var(--gris); font-size: 14px; margin-top: 4px; }

    .lista { display: grid; }
    button {
      font: inherit;
      border: 0;
      border-radius: 0;
      background: #fff;
      color: var(--texto);
      padding: 12px 14px;
      min-height: 50px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .lista button { font: 400 20px/1.1 "triad", monospace; }
    .lista button:nth-child(odd) { background: var(--fila); }
    .lista button.activa { background: var(--naranja); color: #fff; }
    .lista button.activa::after { content: "◀ SONANDO"; margin-left: auto; font-size: 14px; white-space: nowrap; }
    button:active { filter: brightness(0.9); }

    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--marron); border: 2px solid var(--marron); }
    .fila button { justify-content: center; text-align: center; font: 400 18px/1.1 "triad", monospace; }

    .volumen { display: flex; align-items: center; gap: 12px; }
    .volumen input { flex: 1; accent-color: var(--naranja); height: 32px; }
    .volumen output { min-width: 56px; text-align: right; font: 400 22px/1 "triad", monospace; }
    .volumen button { min-width: 96px; justify-content: center; padding: 10px; background: var(--fila); font: 400 16px/1 "triad", monospace; }
    .volumen button.mudo { background: #c00; color: #fff; }

    textarea {
      width: 100%; font: 400 20px/1.2 "triad", monospace; padding: 12px; border-radius: 0;
      border: 2px solid var(--marron); outline: none; resize: vertical; text-transform: uppercase;
    }
    .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--marron); border: 2px solid var(--marron); margin-top: 10px; }
    .opciones.tiempos { grid-template-columns: 1fr 1fr 1fr; }
    .opciones button { justify-content: center; text-align: center; font: 400 15px/1.1 "triad", monospace; min-height: 46px; padding: 8px 4px; }
    .opciones button.elegido { background: var(--marron-2); color: #fff; }
    .opciones button.c-rojo.elegido { background: #b00000; }
    .opciones button.c-naranja.elegido { background: #c2410c; }
    .enviar { width: 100%; margin-top: 10px; min-height: 54px; }
    .alerta-activa { background: #b00000; color: #fff; padding: 12px; font: 400 18px/1.2 "triad", monospace; text-transform: uppercase; }
    .alerta-activa.naranja { background: #c2410c; }
    .alerta-activa small { display: block; font-size: 14px; opacity: 0.85; margin-top: 4px; text-transform: none; }
    .origen-tarifas { font: 400 15px/1.2 "triad", monospace; margin-bottom: 10px; color: var(--gris); }
    .origen-tarifas.editado { color: #b00000; }
    .tarifas { display: grid; border: 2px solid var(--marron); }
    .tarifa-fila { display: grid; grid-template-columns: minmax(0, 1fr) 118px; }
    .tarifa-fila:nth-child(odd) { background: var(--fila); }
    .tarifa-fila input {
      font: 400 20px/1 "triad", monospace; border: 0; border-radius: 0; background: transparent;
      padding: 12px 10px; min-width: 0; color: var(--texto); outline: none;
    }
    .tarifa-fila input:focus { background: #fff6d6; }
    .tarifa-fila .precio-wrap { display: flex; align-items: center; background: var(--naranja); color: #fff; padding-left: 10px; font: 400 20px/1 "triad", monospace; }
    .tarifa-fila .precio-wrap input { color: #fff; text-align: right; padding-left: 4px; }
    .tarifa-fila .precio-wrap input:focus { background: #a35a00; }
    .tarifa-fila.cambiada .precio-wrap { background: #b00000; }
    .tarifa-fila.cambiada .precio-wrap input, .tarifa-fila.cambiada .precio-wrap input:focus { background: transparent; text-decoration: underline; }
    .nota-label { display: block; margin-top: 10px; font-size: 14px; color: var(--gris); }
    .nota-label input { display: block; width: 100%; margin-top: 4px; font: 400 18px/1.2 "triad", monospace; padding: 10px; border-radius: 0; border: 2px solid var(--marron); outline: none; }
    .secundario { width: 100%; justify-content: center; background: var(--fila); font: 400 16px/1 "triad", monospace; margin-top: 2px; }
    .quitar { width: 100%; justify-content: center; background: var(--marron); color: #fff; font: 400 18px/1 "bigdots", monospace; margin: 2px 0 14px; }
    .principal { background: var(--naranja); color: #fff; font: 400 18px/1 "bigdots", monospace; justify-content: center; padding: 12px 18px; }
    .nota { color: var(--gris); font-size: 13px; margin-top: 8px; }

    #toast {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--marron); color: #fff; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      font: 400 18px/1.2 "triad", monospace; text-align: center;
      transform: translateY(100%); transition: transform 0.18s, visibility 0.18s; pointer-events: none; visibility: hidden;
    }
    #toast.ver { transform: none; visibility: visible; }

    #configurar { display: none; }
    #configurar p { margin-bottom: 8px; }
    #configurar input { width: 100%; font: inherit; padding: 12px; border-radius: 0; border: 2px solid var(--marron); margin-bottom: 8px; }
    #configurar button { width: 100%; }
    body.sin-codigo #configurar { display: block; }
    body.sin-codigo .requiere { display: none; }
  </style>
</head>
<body>
  <header>
    <img src="img/Cot_logo_Solo.svg" alt="">
    <h1>CONTROL</h1>
    <span class="estado-tele"><span class="punto" id="punto"></span><span id="estadoTele">conectando…</span></span>
  </header>

  <main>
    <section id="configurar">
      <h2>PRIMERA VEZ</h2>
      <p>Ingresá el código del control (el mismo que cargaste en la tele).</p>
      <input id="codigo" autocomplete="off" autocapitalize="off" placeholder="código">
      <button class="principal" id="guardarCodigo">Guardar</button>
    </section>

    <section class="requiere">
      <h2>AHORA SUENA</h2>
      <div class="sonando" id="sonando">—</div>
      <div class="sonando-sub" id="sonandoSub">Esperando respuesta de la tele…</div>
    </section>

    <section class="requiere">
      <h2>RADIO</h2>
      <div class="lista" id="radios"></div>
    </section>

    <section class="requiere">
      <h2>VOLUMEN</h2>
      <div class="volumen">
        <button id="mudo">SILENCIAR</button>
        <input type="range" id="vol" min="5" max="100" step="5" value="100" aria-label="Volumen">
        <output id="volTxt">100%</output>
      </div>
    </section>

    <section class="requiere">
      <h2>CARTEL</h2>
      <div class="fila">
        <button id="pausa">PAUSAR</button>
        <button data-cmd="pantalla">CAMBIAR PANTALLA</button>
        <button data-cmd="actualizar">BUSCAR CAMBIOS</button>
        <button data-cmd="recargar">RECARGAR</button>
      </div>
    </section>

    <section class="requiere">
      <h2>TARIFAS</h2>
      <div class="origen-tarifas" id="origenTarifas">Esperando la tele…</div>
      <div class="tarifas" id="tarifasLista"></div>
      <label class="nota-label">Aclaración junto a TARIFAS
        <input id="notaTarifas" maxlength="60" placeholder="Incluye tasa de uso $10">
      </label>
      <button class="principal enviar" id="guardarTarifas">GUARDAR TARIFAS EN LA TELE</button>
      <button class="secundario" id="volverGithub">VOLVER A LAS DE GITHUB</button>
    </section>

    <section class="requiere">
      <h2>AVISO EN LA TELE</h2>
      <div id="alertaActiva" hidden>
        <div class="alerta-activa"><span id="alertaActivaTxt"></span><small id="alertaActivaHasta"></small></div>
        <button class="quitar" id="quitarAlerta">QUITAR AVISO</button>
      </div>
      <textarea id="avisoTxt" maxlength="200" rows="3" placeholder="Ej: SERVICIO CANCELADO · ALERTA ROJA"></textarea>
      <div class="opciones" id="colores">
        <button data-color="rojo" class="elegido c-rojo">ROJO · ALERTA</button>
        <button data-color="naranja" class="c-naranja">NARANJA · AVISO</button>
      </div>
      <div class="opciones tiempos" id="tiempos">
        <button data-seg="60">1 MIN</button>
        <button data-seg="300">5 MIN</button>
        <button data-seg="900" class="elegido">15 MIN</button>
        <button data-seg="1800">30 MIN</button>
        <button data-seg="3600">1 HORA</button>
        <button data-seg="0">HASTA QUITARLO</button>
      </div>
      <button class="principal enviar" id="avisoBtn">MOSTRAR EN LA TELE</button>
    </section>

  </main>

  <div id="toast"></div>

  <script>
  (function () {
    "use strict";
    const SERVIDOR = window.CONTROL_SERVIDOR || "https://ntfy.sh";
    const CLAVE = "cartelControl";
    const $ = (id) => document.getElementById(id);

    // Código: ?c=xxxx la primera vez, después queda guardado
    let secreto = null;
    try {
      const u = new URL(location.href);
      const c = u.searchParams.get("c");
      if (c) { localStorage.setItem(CLAVE, c.trim()); history.replaceState(null, "", u.pathname); }
      secreto = localStorage.getItem(CLAVE);
    } catch (e) {}

    $("guardarCodigo").onclick = () => {
      const v = $("codigo").value.trim();
      if (!v) return;
      try { localStorage.setItem(CLAVE, v); } catch (e) {}
      location.reload();
    };
    if (!secreto) { document.body.classList.add("sin-codigo"); return; }

    const canalOrdenes = `${SERVIDOR}/${encodeURIComponent(secreto)}`;
    const canalEstado = `${SERVIDOR}/${encodeURIComponent(secreto)}-estado`;

    let ultimo = null;        // último estado recibido de la tele
    let ultimoMomento = 0;

    function toast(t) {
      const el = $("toast");
      el.textContent = t;
      el.classList.add("ver");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.classList.remove("ver"), 2200);
    }

    async function enviar(cmd, valor, texto) {
      try {
        const r = await fetch(canalOrdenes, { method: "POST", body: JSON.stringify({ cmd, valor }) });
        if (!r.ok) throw new Error(r.status);
        if (texto) toast(texto);
      } catch (e) {
        toast("No se pudo enviar. ¿Tenés internet?");
      }
    }

    /* ---------- Dibujar ---------- */

    const nombresRadios = () =>
      (ultimo && ultimo.radio && ultimo.radio.radios) ||
      (((window.CARTEL || {}).musica || {}).radios || []).map((r) => r.nombre);

    function dibujarRadios() {
      const nombres = nombresRadios();
      const elegida = ultimo && ultimo.radio ? ultimo.radio.elegida : -1;
      const items = nombres.concat(["Mis canciones"]);
      $("radios").innerHTML = "";
      items.forEach((n, i) => {
        const b = document.createElement("button");
        b.textContent = n.replace(/^🎵 /, "");
        if (i === elegida) b.classList.add("activa");
        b.onclick = () => enviar("radio", i, "Cambiando a " + n.replace(/^🎵 /, ""));
        $("radios").appendChild(b);
      });
    }

    function dibujar() {
      dibujarRadios();
      if (!ultimo) return;
      const r = ultimo.radio || {};
      if (r.bloqueada) {
        $("sonando").textContent = "Sonido bloqueado";
        $("sonandoSub").textContent = "Alguien tiene que tocar una tecla en la tele (o permitir reproducción automática en el navegador).";
      } else if (r.modo === "vivo") {
        $("sonando").textContent = r.sonando;
        $("sonandoSub").textContent = "En vivo" + (r.mudo ? " · silenciada" : "");
      } else if (r.sonando) {
        $("sonando").textContent = r.sonando;
        $("sonandoSub").textContent = "Canciones propias" + (r.mudo ? " · silenciada" : "");
      } else {
        $("sonando").textContent = "Silencio";
        $("sonandoSub").textContent = r.canciones ? "" : "La radio no responde y no hay canciones en la carpeta musica.";
      }
      if (typeof r.volumen === "number" && document.activeElement !== $("vol")) {
        $("vol").value = r.volumen;
        $("volTxt").textContent = r.volumen + "%";
      }
      $("mudo").textContent = r.mudo ? "ACTIVAR" : "SILENCIAR";
      $("mudo").classList.toggle("mudo", !!r.mudo);
      $("pausa").textContent = ultimo.pausado ? "SEGUIR" : "PAUSAR";
      dibujarAlerta();
      dibujarTarifas();
    }

    function dibujarAlerta() {
      const a = ultimo && ultimo.alerta;
      const vigente = a && (!a.hasta || a.hasta > Date.now());
      $("alertaActiva").hidden = !vigente;
      if (!vigente) return;
      $("alertaActivaTxt").textContent = a.texto;
      $("alertaActivaTxt").parentElement.className = "alerta-activa " + (a.color || "rojo");
      if (a.hasta) {
        const h = new Date(a.hasta);
        $("alertaActivaHasta").textContent = "En pantalla hasta las " + String(h.getHours()).padStart(2, "0") + ":" + String(h.getMinutes()).padStart(2, "0");
      } else {
        $("alertaActivaHasta").textContent = "En pantalla hasta que lo quites";
      }
    }
    setInterval(() => ultimo && dibujarAlerta(), 15000);

    // Tarifas: se cargan de lo que muestra la tele; no se pisan mientras estás editando
    let editandoTarifas = false;
    let tarifasTele = [];
    function dibujarTarifas() {
      if (!ultimo || !Array.isArray(ultimo.tarifas)) return;
      $("origenTarifas").textContent = ultimo.editado ? "● Cambiadas desde el control (no son las de GitHub)" : "Usando las de GitHub";
      $("origenTarifas").classList.toggle("editado", !!ultimo.editado);
      if (editandoTarifas) return;
      tarifasTele = ultimo.tarifas;
      $("tarifasLista").innerHTML = "";
      tarifasTele.forEach((t, i) => {
        const f = document.createElement("div");
        f.className = "tarifa-fila";
        f.innerHTML = '<input class="t-destino" maxlength="24"><span class="precio-wrap">$<input class="t-precio" inputmode="numeric" maxlength="5"></span>';
        f.querySelector(".t-destino").value = t.destino;
        f.querySelector(".t-precio").value = t.precio;
        f.querySelectorAll("input").forEach((inp) =>
          inp.addEventListener("input", () => {
            editandoTarifas = true;
            const p = f.querySelector(".t-precio");
            p.value = p.value.replace(/[^\d]/g, "");
            f.classList.toggle("cambiada", Number(p.value) !== Number(t.precio) || f.querySelector(".t-destino").value.trim() !== t.destino);
          })
        );
        $("tarifasLista").appendChild(f);
      });
      $("notaTarifas").value = ultimo.notaTarifas || "";
    }
    $("notaTarifas").addEventListener("input", () => (editandoTarifas = true));

    function dibujarConexion() {
      const seg = (Date.now() - ultimoMomento) / 1000;
      const p = $("punto");
      p.className = "punto";
      if (!ultimoMomento) { $("estadoTele").textContent = "sin respuesta"; return; }
      if (seg < 15 * 60) { p.classList.add("ok"); $("estadoTele").textContent = "TELE OK"; }
      else { p.classList.add("viejo"); $("estadoTele").textContent = "última señal " + (ultimo.hora || ""); }
    }

    /* ---------- Escuchar a la tele ---------- */

    const fuente = new EventSource(`${canalEstado}/sse?since=30m`);
    fuente.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.event !== "message") return;
        ultimo = JSON.parse(m.message);
        ultimoMomento = m.time * 1000;
        dibujar();
        dibujarConexion();
      } catch (e) {}
    };
    fuente.onopen = () => enviar("estado");
    setInterval(dibujarConexion, 10000);
    // si en 10 s no contestó nada, avisar
    setTimeout(() => { if (!ultimoMomento) { $("sonandoSub").textContent = "La tele no responde. ¿Está prendida, con internet y con el código cargado?"; } }, 10000);

    /* ---------- Botones ---------- */

    document.querySelectorAll("[data-cmd]").forEach((b) => {
      b.onclick = () => enviar(b.dataset.cmd, null, b.textContent + "…");
    });
    $("mudo").onclick = () => {
      const mudo = !(ultimo && ultimo.radio && ultimo.radio.mudo);
      enviar("mudo", mudo, mudo ? "Silenciando" : "Activando sonido");
    };
    $("vol").oninput = () => ($("volTxt").textContent = $("vol").value + "%");
    $("vol").onchange = () => enviar("volumen", Number($("vol").value), "Volumen " + $("vol").value + "%");
    $("pausa").onclick = () => {
      const p = !(ultimo && ultimo.pausado);
      enviar("pausa", p, p ? "Pausando el cartel" : "Cartel en marcha");
    };
    // Alerta grande
    let color = "rojo";
    let segundos = 900;
    const elegir = (grupo, btn) => {
      grupo.querySelectorAll("button").forEach((b) => b.classList.toggle("elegido", b === btn));
    };
    $("colores").querySelectorAll("button").forEach((b) => (b.onclick = () => { color = b.dataset.color; elegir($("colores"), b); }));
    $("tiempos").querySelectorAll("button").forEach((b) => (b.onclick = () => { segundos = Number(b.dataset.seg); elegir($("tiempos"), b); }));
    $("avisoBtn").onclick = () => {
      const t = $("avisoTxt").value.trim();
      if (!t) { $("avisoTxt").focus(); return; }
      enviar("alerta", { texto: t, segundos, color }, "Aviso en pantalla");
      $("avisoTxt").value = "";
    };
    $("quitarAlerta").onclick = () => enviar("quitar-alerta", null, "Quitando aviso");

    $("guardarTarifas").onclick = () => {
      const filas = [...document.querySelectorAll(".tarifa-fila")].map((f) => ({
        destino: f.querySelector(".t-destino").value.trim(),
        precio: Number(f.querySelector(".t-precio").value),
      }));
      if (!filas.length) return toast("Todavía no llegaron las tarifas de la tele");
      const mal = filas.find((t) => !t.destino || !(t.precio > 0));
      if (mal) return toast("Revisá: hay un destino o precio vacío");
      editandoTarifas = false;
      enviar("tarifas", { tarifas: filas, nota: $("notaTarifas").value }, "Tarifas enviadas a la tele");
    };
    $("volverGithub").onclick = () => {
      if (!confirm("¿Descartar los cambios hechos desde el control y volver a las tarifas de GitHub?")) return;
      editandoTarifas = false;
      enviar("volver-github", null, "Volviendo a las de GitHub");
    };

    dibujar();
  })();
  // Necesario para que el celular lo ofrezca como app instalable
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
