<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#402a1d">
  <title>Control · Cartel COT</title>
  <link rel="icon" href="COT.ico">
  <script src="datos.js"></script>
  <style>
    :root {
      --marron: #402a1d;
      --naranja: #f0511a;
      --naranja-suave: #fde7dd;
      --fondo: #f4f1ee;
      --tarjeta: #ffffff;
      --texto: #2a1c13;
      --gris: #7a6c63;
      --borde: #e4dcd6;
      --verde: #1f9d55;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      padding: 0 16px calc(24px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    header {
      margin: 0 -16px 16px;
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
      background: var(--marron);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header img { height: 26px; }
    header h1 { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; }
    .estado-tele { display: flex; align-items: center; gap: 6px; font-size: 13px; opacity: 0.9; white-space: nowrap; }
    .punto { width: 9px; height: 9px; border-radius: 50%; background: #999; }
    .punto.ok { background: #3ddc84; box-shadow: 0 0 6px #3ddc84; }
    .punto.viejo { background: #f5b301; }

    main { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    section {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 14px;
    }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gris); margin-bottom: 10px; font-weight: 600; }

    .sonando { font-size: 18px; font-weight: 600; }
    .sonando-sub { color: var(--gris); font-size: 14px; margin-top: 2px; }

    .lista { display: grid; gap: 8px; }
    button {
      font: inherit;
      border: 1px solid var(--borde);
      background: #fff;
      color: var(--texto);
      border-radius: 10px;
      padding: 12px 14px;
      min-height: 48px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button:active { transform: scale(0.98); }
    button.activa { border-color: var(--naranja); background: var(--naranja-suave); font-weight: 600; }
    button.activa::after { content: "● sonando"; margin-left: auto; color: var(--naranja); font-size: 12px; font-weight: 600; white-space: nowrap; }
    button.principal { background: var(--naranja); border-color: var(--naranja); color: #fff; font-weight: 600; justify-content: center; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .fila button { justify-content: center; text-align: center; }

    .volumen { display: flex; align-items: center; gap: 12px; }
    .volumen input { flex: 1; accent-color: var(--naranja); height: 32px; }
    .volumen output { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .volumen button { min-width: 52px; justify-content: center; padding: 10px; }

    .aviso { display: flex; gap: 8px; }
    .aviso input {
      flex: 1; min-width: 0; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--borde);
    }
    .aviso button { justify-content: center; }
    .nota { color: var(--gris); font-size: 13px; margin-top: 8px; }

    #toast {
      position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
      background: var(--marron); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
      opacity: 0; transition: 0.2s; pointer-events: none; max-width: calc(100% - 32px);
    }
    #toast.ver { opacity: 1; transform: translateX(-50%); }

    #configurar { display: none; }
    #configurar input { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--borde); margin: 8px 0; }
    body.sin-codigo #configurar { display: block; }
    body.sin-codigo .requiere { display: none; }
  </style>
</head>
<body>
  <header>
    <img src="img/Cot_logo_Solo.svg" alt="">
    <h1>Control del cartel</h1>
    <span class="estado-tele"><span class="punto" id="punto"></span><span id="estadoTele">conectando…</span></span>
  </header>

  <main>
    <section id="configurar">
      <h2>Primera vez</h2>
      <p>Ingresá el código del control (el mismo que cargaste en la tele).</p>
      <input id="codigo" autocomplete="off" autocapitalize="off" placeholder="código">
      <button class="principal" id="guardarCodigo">Guardar</button>
    </section>

    <section class="requiere">
      <h2>Ahora suena</h2>
      <div class="sonando" id="sonando">—</div>
      <div class="sonando-sub" id="sonandoSub">Esperando respuesta de la tele…</div>
    </section>

    <section class="requiere">
      <h2>Radio</h2>
      <div class="lista" id="radios"></div>
    </section>

    <section class="requiere">
      <h2>Volumen</h2>
      <div class="volumen">
        <button id="mudo" aria-label="Silenciar">🔇</button>
        <input type="range" id="vol" min="5" max="100" step="5" value="100" aria-label="Volumen">
        <output id="volTxt">100%</output>
      </div>
    </section>

    <section class="requiere">
      <h2>Cartel</h2>
      <div class="fila">
        <button id="pausa">⏸ Pausar</button>
        <button data-cmd="pantalla">⇄ Cambiar pantalla</button>
        <button data-cmd="actualizar">⟳ Buscar cambios</button>
        <button data-cmd="recargar">↻ Recargar</button>
      </div>
    </section>

    <section class="requiere">
      <h2>Mostrar un aviso en la tele</h2>
      <div class="aviso">
        <input id="avisoTxt" maxlength="140" placeholder="Ej: El de las 16:30 sale con demora">
        <button class="principal" id="avisoBtn">Enviar</button>
      </div>
      <p class="nota">Aparece grande en el medio de la tele durante 15 segundos.</p>
    </section>
  </main>

  <div id="toast"></div>

  <script>
  (function () {
    "use strict";
    const SERVIDOR = window.CONTROL_SERVIDOR || "https://ntfy.sh";
    const CLAVE = "cartelControl";
    const $ = (id) => document.getElementById(id);

    // Código: ?c=xxxx la primera vez, después queda guardado
    let secreto = null;
    try {
      const u = new URL(location.href);
      const c = u.searchParams.get("c");
      if (c) { localStorage.setItem(CLAVE, c.trim()); history.replaceState(null, "", u.pathname); }
      secreto = localStorage.getItem(CLAVE);
    } catch (e) {}

    $("guardarCodigo").onclick = () => {
      const v = $("codigo").value.trim();
      if (!v) return;
      try { localStorage.setItem(CLAVE, v); } catch (e) {}
      location.reload();
    };
    if (!secreto) { document.body.classList.add("sin-codigo"); return; }

    const canalOrdenes = `${SERVIDOR}/${encodeURIComponent(secreto)}`;
    const canalEstado = `${SERVIDOR}/${encodeURIComponent(secreto)}-estado`;

    let ultimo = null;        // último estado recibido de la tele
    let ultimoMomento = 0;

    function toast(t) {
      const el = $("toast");
      el.textContent = t;
      el.classList.add("ver");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.classList.remove("ver"), 2200);
    }

    async function enviar(cmd, valor, texto) {
      try {
        const r = await fetch(canalOrdenes, { method: "POST", body: JSON.stringify({ cmd, valor }) });
        if (!r.ok) throw new Error(r.status);
        if (texto) toast(texto);
      } catch (e) {
        toast("No se pudo enviar. ¿Tenés internet?");
      }
    }

    /* ---------- Dibujar ---------- */

    const nombresRadios = () =>
      (ultimo && ultimo.radio && ultimo.radio.radios) ||
      (((window.CARTEL || {}).musica || {}).radios || []).map((r) => r.nombre);

    function dibujarRadios() {
      const nombres = nombresRadios();
      const elegida = ultimo && ultimo.radio ? ultimo.radio.elegida : -1;
      const items = nombres.concat(["🎵 Mis canciones (carpeta musica)"]);
      $("radios").innerHTML = "";
      items.forEach((n, i) => {
        const b = document.createElement("button");
        b.textContent = (i < nombres.length ? "📻 " : "") + n;
        if (i === elegida) b.classList.add("activa");
        b.onclick = () => enviar("radio", i, "Cambiando a " + n.replace(/^🎵 /, ""));
        $("radios").appendChild(b);
      });
    }

    function dibujar() {
      dibujarRadios();
      if (!ultimo) return;
      const r = ultimo.radio || {};
      if (r.bloqueada) {
        $("sonando").textContent = "🔈 Sonido bloqueado";
        $("sonandoSub").textContent = "Alguien tiene que tocar una tecla en la tele (o permitir reproducción automática en el navegador).";
      } else if (r.modo === "vivo") {
        $("sonando").textContent = "📻 " + r.sonando;
        $("sonandoSub").textContent = "En vivo" + (r.mudo ? " · silenciada" : "");
      } else if (r.sonando) {
        $("sonando").textContent = "🎵 " + r.sonando;
        $("sonandoSub").textContent = "Canciones propias" + (r.mudo ? " · silenciada" : "");
      } else {
        $("sonando").textContent = "Silencio";
        $("sonandoSub").textContent = r.canciones ? "" : "La radio no responde y no hay canciones en la carpeta musica.";
      }
      if (typeof r.volumen === "number" && document.activeElement !== $("vol")) {
        $("vol").value = r.volumen;
        $("volTxt").textContent = r.volumen + "%";
      }
      $("mudo").textContent = r.mudo ? "🔈" : "🔇";
      $("mudo").setAttribute("aria-label", r.mudo ? "Activar sonido" : "Silenciar");
      $("pausa").textContent = ultimo.pausado ? "▶ Seguir" : "⏸ Pausar";
    }

    function dibujarConexion() {
      const seg = (Date.now() - ultimoMomento) / 1000;
      const p = $("punto");
      p.className = "punto";
      if (!ultimoMomento) { $("estadoTele").textContent = "sin respuesta"; return; }
      if (seg < 15 * 60) { p.classList.add("ok"); $("estadoTele").textContent = "tele conectada"; }
      else { p.classList.add("viejo"); $("estadoTele").textContent = "última señal " + (ultimo.hora || ""); }
    }

    /* ---------- Escuchar a la tele ---------- */

    const fuente = new EventSource(`${canalEstado}/sse?since=30m`);
    fuente.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.event !== "message") return;
        ultimo = JSON.parse(m.message);
        ultimoMomento = m.time * 1000;
        dibujar();
        dibujarConexion();
      } catch (e) {}
    };
    fuente.onopen = () => enviar("estado");
    setInterval(dibujarConexion, 10000);
    // si en 10 s no contestó nada, avisar
    setTimeout(() => { if (!ultimoMomento) { $("sonandoSub").textContent = "La tele no responde. ¿Está prendida, con internet y con el código cargado?"; } }, 10000);

    /* ---------- Botones ---------- */

    document.querySelectorAll("[data-cmd]").forEach((b) => {
      b.onclick = () => enviar(b.dataset.cmd, null, b.textContent.replace(/^\S+\s/, "") + "…");
    });
    $("mudo").onclick = () => {
      const mudo = !(ultimo && ultimo.radio && ultimo.radio.mudo);
      enviar("mudo", mudo, mudo ? "Silenciando" : "Activando sonido");
    };
    $("vol").oninput = () => ($("volTxt").textContent = $("vol").value + "%");
    $("vol").onchange = () => enviar("volumen", Number($("vol").value), "Volumen " + $("vol").value + "%");
    $("pausa").onclick = () => {
      const p = !(ultimo && ultimo.pausado);
      enviar("pausa", p, p ? "Pausando el cartel" : "Cartel en marcha");
    };
    $("avisoBtn").onclick = () => {
      const t = $("avisoTxt").value.trim();
      if (!t) return;
      enviar("aviso", t, "Aviso enviado");
      $("avisoTxt").value = "";
    };

    dibujar();
  })();
  </script>
</body>
</html>
